<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>航道渲染测试 · Sky Team</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg0: #0c141d; --bg1: #141f2b; --bg2: #1b2a39; --edge: #2e4155;
    --text: #dfe9f2; --dim: #8193a5; --blue: #4aa8ff; --amber: #ffc53d;
    --mono: "SF Mono", Menlo, Consolas, monospace;
  }
  body { font-family: system-ui, sans-serif; background: var(--bg0); color: var(--text); min-height: 100vh; padding: 20px; }
  header { display: flex; align-items: baseline; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
  header h1 { font-size: 20px; }
  header .sub { color: var(--dim); font-size: 13px; }
  header a { margin-left: auto; color: var(--blue); font-size: 13px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 16px; }
  .scenario {
    background: var(--bg1); border: 1px solid var(--edge); border-radius: 12px; padding: 14px;
  }
  .scenario h2 { font-size: 15px; margin-bottom: 6px; }
  .scenario p { font-size: 12.5px; color: var(--dim); line-height: 1.6; margin-bottom: 10px; }
  .scenario code { font-family: var(--mono); font-size: 11px; color: var(--amber); }
  .card { background: var(--bg2); border: 1px solid var(--edge); border-radius: 10px; padding: 12px; margin-bottom: 10px; }
  .card h3 { font-size: 13px; color: var(--dim); margin-bottom: 10px; letter-spacing: .5px; }
  .state-snippet {
    font-family: var(--mono); font-size: 11px; line-height: 1.5; color: #a8c4dc;
    background: #0a1119; border-radius: 8px; padding: 8px 10px; white-space: pre-wrap;
  }

  /* 与 index.html 航道样式同步 */
  .approach-row { display: flex; gap: 4px; position: relative; }
  .app-cell {
    flex: 1; height: 54px; border: 1px solid var(--edge); border-radius: 8px;
    display: flex; align-items: center; justify-content: center; position: relative;
    background: var(--bg1); font-size: 11px; color: var(--dim); box-shadow: inset 0 2px 5px rgba(0,0,0,.4);
    transition: background .35s ease, border-color .35s ease, box-shadow .35s ease;
  }
  .app-cell .cell-no { font-size: 10px; position: absolute; top: 3px; left: 5px; color: var(--dim); font-family: var(--mono); }
  .app-cell.has-icons::after { content: none !important; }
  .app-cell .app-icons { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0; line-height: 1; z-index: 1; }
  .app-cell .app-icon { font-size: 16px; line-height: 1; }
  .app-cell .me-icon { font-size: 17px; filter: drop-shadow(0 0 6px rgba(74,168,255,.9)); }
  .app-cell .traffic-icon { filter: drop-shadow(0 0 4px rgba(255,90,90,.8)); }
  .app-cell .traffic-badge {
    font-size: 9px; font-family: var(--mono); font-weight: 800; color: #ffb4b4;
    background: rgba(58,26,26,.85); padding: 0 4px; border-radius: 4px; margin-top: 1px;
  }
  .app-cell.plane { background: radial-gradient(circle at 50% 55%, rgba(255,90,90,.28), transparent 70%), var(--bg1); border-color: #7a2f2f; animation: planePulse 1.6s ease-in-out infinite; }
  .app-cell.me { border: 2px solid var(--blue); background: radial-gradient(circle at 50% 55%, rgba(74,168,255,.3), transparent 70%), var(--bg1); }
  .app-cell.traffic-here {
    border-color: #c45a5a;
    background:
      radial-gradient(circle at 35% 45%, rgba(74,168,255,.22), transparent 55%),
      radial-gradient(circle at 65% 55%, rgba(255,90,90,.25), transparent 55%),
      var(--bg1);
    box-shadow: inset 0 0 0 1px rgba(255,197,61,.35), 0 0 10px rgba(255,90,90,.2);
  }
  .app-cell.traffic-multi { border-color: #9a3a3a; }
  .app-cell.airport { background: radial-gradient(circle at 50% 70%, rgba(61,220,132,.25), transparent 75%), var(--bg1); border-color: #1f7a48; }
  .app-cell.airport::after { content: "🛬"; font-size: 17px; }
  @keyframes planePulse { 0%,100% { box-shadow: inset 0 2px 5px rgba(0,0,0,.4), 0 0 0 rgba(255,90,90,0); } 50% { box-shadow: inset 0 2px 5px rgba(0,0,0,.4), 0 0 12px rgba(255,90,90,.35); } }
</style>
</head>
<body>
<header>
  <h1>🛤 航道渲染测试</h1>
  <span class="sub">traffic 模块 · 两档预设场景</span>
  <a href="/">← 返回游戏</a>
  <a href="/test/module-lab.html">模块实验室</a>
</header>

<div class="grid" id="scenarios"></div>

<script src="/src/logic/game-logic.js"></script>
<script src="/src/scenarios/scenario-registry.js"></script>
<script src="/src/widgets/approach.js"></script>
<script>
'use strict';

var SCENES = [
  {
    id: 'same-cell',
    title: '场景一 · 与交通飞机同格',
    desc: '我机在距 3，交通飞机也在距 3（共占一格）。官方规则：须前进且当前位置有飞机才会撞机。',
    state: {
      distance: 3,
      traffic: [3],
      waiting: false,
      round: 1,
      phase: 'place'
    }
  },
  {
    id: 'multi-ahead',
    title: '场景二 · 前方一格多架飞机',
    desc: '我机在距 4，距 3 堆叠 3 架交通飞机（traffic 数组重复同距离）。无线电每次清除 1 架。',
    state: {
      distance: 4,
      traffic: [3, 3, 3],
      waiting: false,
      round: 1,
      phase: 'place'
    }
  }
];

function makeState(partial) {
  var base = GameLogic.newGame('yul');
  GameLogic.beginRound(base);
  Object.keys(partial).forEach(function (k) { base[k] = partial[k]; });
  return base;
}

function renderScene(scene) {
  var state = makeState(scene.state);
  var ctx = { state: state, logic: GameLogic, ui: { mode: 'local' } };
  var html = ApproachWidget.render(ctx);
  var snippet = JSON.stringify({ distance: state.distance, traffic: state.traffic }, null, 2);
  return '<section class="scenario" id="' + scene.id + '">' +
    '<h2>' + scene.title + '</h2>' +
    '<p>' + scene.desc + '</p>' +
    html +
    '<pre class="state-snippet">' + snippet + '</pre>' +
    '</section>';
}

document.getElementById('scenarios').innerHTML = SCENES.map(renderScene).join('');
</script>
</body>
</html>
